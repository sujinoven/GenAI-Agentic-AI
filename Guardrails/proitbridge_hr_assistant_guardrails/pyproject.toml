requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "guardrails-ai>=0.11.0",
    "guardrails-ai-ban-list>=0.1.0",
    "guardrails-ai-detect-pii>=0.0.6",
    "guardrails-ai-valid-length>=0.1.0",
    "langchain>=1.4.7",
    "langchain-core>=1.7.3",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "pydantic>=2.14.2",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
